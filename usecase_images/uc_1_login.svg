<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- Stick Figure Actor -->
  <!-- Head -->
  <circle cx="150" cy="140" r="22" stroke="#000000" stroke-width="2.5" fill="#ffffff" />
  <!-- Spine -->
  <line x1="150" y1="162" x2="150" y2="255" stroke="#000000" stroke-width="2.5" />
  <!-- Arms -->
  <line x1="105" y1="195" x2="195" y2="195" stroke="#000000" stroke-width="2.5" />
  <!-- Legs -->
  <line x1="150" y1="255" x2="115" y2="325" stroke="#000000" stroke-width="2.5" />
  <line x1="150" y1="255" x2="185" y2="325" stroke="#000000" stroke-width="2.5" />
  <!-- Actor Label -->
  <text x="150" y="365" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#000000">Admin / Officer</text>

  <!-- Communication Link Arrow -->
  <line x1="220" y1="225" x2="340" y2="225" stroke="#000000" stroke-width="2" marker-end="url(#arrow)" />

  <!-- System Boundary Box -->
  <rect x="360" y="60" width="310" height="310" stroke="#000000" stroke-width="2.5" fill="none" />
  <!-- System Title -->
  <text x="515" y="95" font-family="Arial" font-size="22" text-anchor="middle" font-weight="bold" fill="#000000">Sistem House of Salbai</text>
  <line x1="380" y1="110" x2="650" y2="110" stroke="#000000" stroke-width="1.5" stroke-dasharray="4" />

  <!-- Use Case Oval -->
  <ellipse cx="515" cy="230" rx="120" ry="45" stroke="#000000" stroke-width="2.5" fill="#ffffff" />
  <text x="510" y="225" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#000000">Login Admin /</text><text x="510" y="250" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold" fill="#000000">Officer</text>
</svg>